name: Publish Android preview APK

on:
  push:
    branches:
      - improve/offline-finance-foundation-20261103
    paths:
      - .github/workflows/publish-preview.yml

permissions:
  contents: write

concurrency:
  group: gaga-finance-preview-publish
  cancel-in-progress: false

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify unit tests, lint, and build APK
        run: |
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Publish downloadable public PREVIEW release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: gaga-finance-0.6.0-daily-preview.1
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk GaGaFinance-0.6.0-Daily-Preview.apk
          sha256sum GaGaFinance-0.6.0-Daily-Preview.apk > SHA256SUMS.txt
          gh release create "$TAG" GaGaFinance-0.6.0-Daily-Preview.apk SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "GaGa Finance 0.6.0 — Daily Finance Android preview (offline testing only)" \
            --prerelease \
            --notes "Daily dashboard with due/overdue alerts, quick income/expense recording, historic transaction dates, 7-day/month transaction filters, extra spending categories, cleaner settings layout, and existing GaGa branding. Local offline data only. In-app reminders do not create background notifications; no real banking, online sync, or verified balances. This separate preview installs with a new empty database. Protect previous finance records; don't uninstall earlier app versions without verified backup and restoration strategy. The database and exports are not encrypted. NOT for production money movement."
