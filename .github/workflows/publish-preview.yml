name: Publish Android preview APK

on:
  push:
    branches:
      - improve/offline-finance-foundation-20261103
    paths:
      - .github/workflows/publish-preview.yml

permissions:
  contents: write

concurrency:
  group: gaga-finance-preview-publish
  cancel-in-progress: false

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android API 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - name: Verify unit tests, lint, and build APK
        run: |
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Publish downloadable public PREVIEW release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: gaga-finance-0.7.0-play-prep-preview.1
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk GaGaFinance-0.7.0-PlayPrep-Preview.apk
          sha256sum GaGaFinance-0.7.0-PlayPrep-Preview.apk > SHA256SUMS.txt
          gh release create "$TAG" GaGaFinance-0.7.0-PlayPrep-Preview.apk SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "GaGa Finance 0.7.0 — Play prep Android preview (offline testing only)" \
            --prerelease \
            --notes "API 36 Play-target preview, opt-in WorkManager due reminders, password-encrypted manual JSON backups, existing Today cashflow, transactions, People Ledger, budgets and loans. PREVIEW ONLY: private SQLite database is NOT independently encrypted, no cloud login/sync, no real bank/wallet/payment or guaranteed alarm scheduling. The separate preview07 package starts with an empty database and does not migrate older previews automatically. Physical-device QA and stable production AAB signing remain pending."
