name: Build privately signed Play Store bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-aab:
    name: Validate and build Play-upload AAB
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android API 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - name: Restore upload keystore from repository secrets
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.GAGA_FINANCE_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.GAGA_FINANCE_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.GAGA_FINANCE_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.GAGA_FINANCE_KEY_PASSWORD }}
        run: |
          test -n "$UPLOAD_KEYSTORE_B64" || { echo "Upload keystore secret missing"; exit 1; }
          test -n "$UPLOAD_STORE_PASSWORD" || { echo "Store password secret missing"; exit 1; }
          test -n "$UPLOAD_KEY_ALIAS" || { echo "Key alias secret missing"; exit 1; }
          test -n "$UPLOAD_KEY_PASSWORD" || { echo "Key password secret missing"; exit 1; }
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gaga-finance-upload.jks"
          test -s "$RUNNER_TEMP/gaga-finance-upload.jks"

      - name: Test, lint and build signed release App Bundle
        env:
          GAGA_FINANCE_UPLOAD_KEY_FILE: ${{ runner.temp }}/gaga-finance-upload.jks
          GAGA_FINANCE_UPLOAD_STORE_PASSWORD: ${{ secrets.GAGA_FINANCE_KEYSTORE_PASSWORD }}
          GAGA_FINANCE_UPLOAD_KEY_ALIAS: ${{ secrets.GAGA_FINANCE_KEY_ALIAS }}
          GAGA_FINANCE_UPLOAD_KEY_PASSWORD: ${{ secrets.GAGA_FINANCE_KEY_PASSWORD }}
        run: |
          gradle :app:testDebugUnitTest :app:lintRelease :app:bundleRelease --stacktrace

      - name: Verify signature and SHA-256
        run: |
          test -s app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -strict -certs app/build/outputs/bundle/release/app-release.aab
          sha256sum app/build/outputs/bundle/release/app-release.aab > app/build/outputs/bundle/release/SHA256SUMS.txt

      - name: Upload private build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gaga-finance-play-signed-aab
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/bundle/release/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error

      - name: Remove key file
        if: always()
        run: rm -f "$RUNNER_TEMP/gaga-finance-upload.jks"
